# Increase Gradle JVM memory — the default 512MB is too low for Kotlin + Compose + Hilt
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Enable Gradle daemon and parallel builds for speed
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# AndroidX
android.useAndroidX=true

# KSP1 workaround for Room compatibility with Kotlin 2.1.0
ksp.useKSP2=false

# Suppress known warning
android.suppressUnsupportedCompileSdk=34
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
